name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Ruff + pytest (core, service, bot, API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  js:
    name: JS port parity + demo (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test js-tests/*.test.mjs

  e2e:
    name: Demo in Chromium (1440 px + 375 px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.65.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/e2e.mjs

  docker:
    name: Docker image builds and runs as non-root
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t kitob-klubi .
      - name: Not root, and the app imports
        run: |
          test "$(docker run --rm kitob-klubi id -u)" != "0"
          docker run --rm kitob-klubi python -c "import kitobklubi.web, kitobklubi.bot.setup; print('ok')"
