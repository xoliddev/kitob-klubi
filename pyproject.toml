[project]
name = "kitob-klubi"
version = "1.0.0"
description = "Reading club for Uzbekistan: Telegram bot + Mini App with a daily reading streak (olov) and freezes, club marathons with a fair live leaderboard, and HMAC-signed certificates anyone can verify"
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "S603"]
"scripts/*" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
